<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="850" height="140" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <linearGradient id="grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="accent-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a7f37"/>
      <stop offset="50%" stop-color="#116329"/>
      <stop offset="100%" stop-color="#0969da"/>
    </linearGradient>
  </defs>

  <style>
    .prompt { fill: #1a7f37; font-weight: bold; font-size: 15px; }
    .user { fill: #0969da; font-weight: bold; font-size: 15px; }
    .text-title { fill: #1f2328; font-weight: 600; font-size: 22px; }

    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { fill: #1a7f37; animation: cursor-blink 0.8s infinite; }

    @keyframes typing-effect {
      0%, 10% { width: 0px; }
      45%, 75% { width: 560px; }
      95%, 100% { width: 0px; }
    }
    .type-box {
      animation: typing-effect 7s steps(40, end) infinite;
    }

    @keyframes cursor-move {
      0%, 10% { transform: translateX(0px); }
      45%, 75% { transform: translateX(560px); }
      95%, 100% { transform: translateX(0px); }
    }
    .cursor-wrap {
      animation: cursor-move 7s steps(40, end) infinite;
    }
  </style>

  <!-- Background Card -->
  <rect x="0" y="0" width="850" height="140" rx="12" ry="12" fill="url(#grad-light)" stroke="#d0d7de" stroke-width="1"/>

  <!-- Window Header Bar -->
  <path d="M 0,0 L 850,0 A 12,12 0 0,1 850,32 L 0,32 L 0,0 Z" fill="#f3f4f6"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>
  <text x="425" y="21" text-anchor="middle" fill="#57606a" font-size="12" font-weight="600">terminal — bash — 85x14</text>

  <!-- Terminal Content -->
  <g transform="translate(25, 62)">
    <text class="user" x="0" y="0">harsh@developer</text>
    <text class="prompt" x="145" y="0">:~$</text>
    <text class="text-title" x="180" y="0">Hi, I'm Harsh 👋</text>
  </g>

  <g transform="translate(25, 102)">
    <text class="prompt" x="0" y="0">></text>

    <!-- Inner SVG animating width for character-by-character typing -->
    <svg x="20" y="-18" width="0" height="30" class="type-box">
      <text fill="url(#accent-grad-light)" font-size="16" font-weight="700" x="0" y="18">Building software • Java, Python, React &amp; Flutter</text>
    </svg>

    <!-- Moving Cursor -->
    <g class="cursor-wrap" transform="translate(20, 0)">
      <rect class="cursor" x="0" y="-16" width="9" height="20"/>
    </g>
  </g>
</svg>
