  <g transform="translate(25, 102)">
    <text class="prompt" x="0" y="0">></text>
    <text class="type-text" x="20" y="0"><tspan class="tc-0">B</tspan><tspan class="tc-1">u</tspan><tspan class="tc-2">i</tspan><tspan class="tc-3">l</tspan><tspan class="tc-4">d</tspan><tspan class="tc-5">i</tspan><tspan class="tc-6">n</tspan><tspan class="tc-7">g</tspan><tspan class="tc-8">&#160;</tspan><tspan class="tc-9">s</tspan><tspan class="tc-10">o</tspan><tspan class="tc-11">f</tspan><tspan class="tc-12">t</tspan><tspan class="tc-13">w</tspan><tspan class="tc-14">a</tspan><tspan class="tc-15">r</tspan><tspan class="tc-16">e</tspan><tspan class="tc-17">&#160;</tspan><tspan class="tc-18">•</tspan><tspan class="tc-19">&#160;</tspan><tspan class="tc-20">J</tspan><tspan class="tc-21">a</tspan><tspan class="tc-22">v</tspan><tspan class="tc-23">a</tspan><tspan class="tc-24">,</tspan><tspan class="tc-25">&#160;</tspan><tspan class="tc-26">P</tspan><tspan class="tc-27">y</tspan><tspan class="tc-28">t</tspan><tspan class="tc-29">h</tspan><tspan class="tc-30">o</tspan><tspan class="tc-31">n</tspan><tspan class="tc-32">,</tspan><tspan class="tc-33">&#160;</tspan><tspan class="tc-34">R</tspan><tspan class="tc-35">e</tspan><tspan class="tc-36">a</tspan><tspan class="tc-37">c</tspan><tspan class="tc-38">t</tspan><tspan class="tc-39">&#160;</tspan><tspan class="tc-40">&amp;</tspan><tspan class="tc-41">&#160;</tspan><tspan class="tc-42">F</tspan><tspan class="tc-43">l</tspan><tspan class="tc-44">u</tspan><tspan class="tc-45">t</tspan><tspan class="tc-46">t</tspan><tspan class="tc-47">e</tspan><tspan class="tc-48">r</tspan></text>
    <g class="cursor-wrap" transform="translate(20, 0)">
      <rect class="cursor" x="0" y="-16" width="9" height="20"/>
    </g>
  </g>
