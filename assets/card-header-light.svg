    @keyframes cursor-type {
      0%, 3% { transform: translateX(0px); }
      35%, 85% { transform: translateX(470.4px); }
      95%, 100% { transform: translateX(0px); }
    }
    .cursor-wrap {
      animation: cursor-type 7.0s steps(49, end) infinite;
    }
    
